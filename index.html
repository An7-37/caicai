<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,

               maximum-scale=1.0,
               user-scalable=no">

<title>给财财的一份神秘礼物</title>


<style>

/* =========================================================
   基础
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #fff8fa 48%,
            #f8f4f6 100%
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}


/* =========================================================
   顶部栏
========================================================= */

.header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 62px;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(255,255,255,.95);

    backdrop-filter: blur(10px);

    border-bottom:
        1px solid #eeeeee;

    color: #222;

    font-size: 17px;

    font-weight: 600;
}

.back {

    position: absolute;

    left: 18px;

    font-size: 30px;

    line-height: 1;

    font-weight: 300;
}

.menu {

    position: absolute;

    right: 18px;

    font-size: 23px;

    letter-spacing: 2px;
}


/* =========================================================
   左上角 To 财财
========================================================= */

.to-name {

    position: fixed;

    z-index: 10000;

    top: 77px;

    left: 18px;

    color: #555;

    font-size: 16px;

    font-weight: 500;

    letter-spacing: 1px;

    text-shadow:
        0 1px 3px
        rgba(0,0,0,.08);

    pointer-events: none;

    opacity: 0;

    animation:
        toNameIn
        1.2s
        ease
        .5s
        forwards;
}


@keyframes toNameIn {

    from {

        opacity: 0;

        transform:
            translateY(-10px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   主舞台
========================================================= */

.scene {

    position: absolute;

    top: 62px;

    left: 0;
    right: 0;

    bottom: 70px;

    overflow: hidden;

    perspective: 900px;
}


/* =========================================================
   祝福文字
========================================================= */

.message {

    position: absolute;

    left: 0;
    top: 0;

    padding:
        7px 11px;

    border-radius: 9px;

    font-size: 13px;

    line-height: 1.3;

    white-space: nowrap;

    color: #333;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

    opacity: 0;

    /*
       最初从远处出现
    */

    transform:
        translate(
            var(--startX),
            var(--startY)
        )
        scale(.15)
        rotate(var(--startRotate));

    transition:
        transform
        var(--enterDuration)
        cubic-bezier(.16,1,.3,1),

        opacity
        1s
        ease;

    will-change:
        transform,
        opacity;

    pointer-events: none;
}


/* =========================================================
   第一阶段：平铺屏幕
========================================================= */

.message.visible {

    opacity: 1;

    transform:
        translate(
            var(--flatX),
            var(--flatY)
        )
        scale(1)
        rotate(var(--flatRotate));
}


/* =========================================================
   第二阶段：汇聚成爱心
========================================================= */

.message.toHeart {

    opacity: 1;

    transform:
        translate(
            var(--heartX),
            var(--heartY)
        )
        scale(1)
        rotate(var(--heartRotate));

    transition:
        transform
        3.2s
        cubic-bezier(.22,1,.36,1);
}


/* =========================================================
   爱心形成之后
========================================================= */

.message.heartFloat {

    animation:
        heartFloat
        3s
        ease-in-out
        infinite
        alternate;
}


@keyframes heartFloat {

    0% {

        margin-top: -3px;

    }

    100% {

        margin-top: 3px;

    }

}


/* =========================================================
   底部
========================================================= */

.bottom {

    position: fixed;

    z-index: 9999;

    left: 0;
    right: 0;

    bottom: 0;

    height: 70px;

    background:
        rgba(0,0,0,.93);

    display: flex;

    align-items: center;

    justify-content: flex-end;

    padding-right: 15px;
}

.play {

    width: 58px;
    height: 44px;

    border-radius: 9px;

    background: #222;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 19px;

    cursor: pointer;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.25);

    -webkit-tap-highlight-color:
        transparent;
}

.speed {

    color: white;

    font-size: 13px;

    margin-left: 5px;
}


/* =========================================================
   小爱心粒子
========================================================= */

.particle {

    position: absolute;

    z-index: 3000;

    pointer-events: none;

    color: #ff91aa;

    font-size:
        var(--size);

    opacity: 0;

    animation:
        particleMove
        3s
        ease-out
        forwards;
}


@keyframes particleMove {

    0% {

        opacity: 0;

        transform:
            translate(0,0)
            scale(.2)
            rotate(0deg);

    }

    25% {

        opacity: 1;

    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--moveX),
                var(--moveY)
            )
            scale(1.3)
            rotate(30deg);

    }

}


/* =========================================================
   闪光粒子
========================================================= */

.sparkle {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px
        #ff9db3;

    opacity: 0;

    animation:
        sparkleAnimation
        1.5s
        ease-out
        forwards;
}


@keyframes sparkleAnimation {

    0% {

        opacity: 0;

        transform:
            scale(.2);

    }

    40% {

        opacity: 1;

        transform:
            scale(1.5);

    }

    100% {

        opacity: 0;

        transform:
            scale(0);

    }

}


/* =========================================================
   手机小屏适配
========================================================= */

@media (max-width: 380px) {

    .message {

        font-size: 12px;

        padding:
            6px 9px;

    }

    .to-name {

        font-size: 15px;

    }

}


/* =========================================================
   大屏适配
========================================================= */

@media (min-width: 700px) {

    .message {

        font-size: 15px;

    }

    .to-name {

        font-size: 18px;

    }

}

</style>

/* =========================================================
   卡片颜色
========================================================= */

const colors = [

    "#FFE4A8",
    "#FFD0DA",
    "#FFC5B8",
    "#FFE8A6",
    "#F8C9D8",
    "#DDEBFF",
    "#FFD9B0",
    "#E8D1FF",
    "#D8F1DF",
    "#FFE0C7",
    "#FFD6E0",
    "#E5D4FF"

];


/* =========================================================
   页面元素
========================================================= */

const scene =
    document.getElementById("scene");

const play =
    document.getElementById("play");


/* =========================================================
   不重复随机系统
========================================================= */

let shuffledMessages = [];

let messageIndex = 0;


/* Fisher-Yates 洗牌 */

function shuffleMessages() {

    shuffledMessages =
        [...messages];

    for (
        let i =
            shuffledMessages.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffledMessages[i],
            shuffledMessages[j]

        ] =
        [
            shuffledMessages[j],
            shuffledMessages[i]
        ];

    }


    messageIndex = 0;

}


/* 第一次洗牌 */

shuffleMessages();


/* =========================================================
   随机数
========================================================= */

function random(min, max) {

    return Math.random()
        * (max - min)
        + min;

}


/* =========================================================
   获取下一条不重复祝福
========================================================= */

function getNextMessage() {

    if (
        messageIndex >=
        shuffledMessages.length
    ) {

        shuffleMessages();

    }


    const text =
        shuffledMessages[
            messageIndex
        ];


    messageIndex++;


    return text;

}


/* =========================================================
   爱心数学公式
========================================================= */

function heartPosition(t) {

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        13 *
        Math.cos(t)

        - 5 *
        Math.cos(2 * t)

        - 2 *
        Math.cos(3 * t)

        - Math.cos(4 * t);


    return {
        x,
        y
    };

}


/* =========================================================
   创建一条祝福文字
========================================================= */

function createMessage(
    index,
    total
) {


    const el =
        document.createElement("div");


    el.className =
        "message";


    /* -----------------------------------------------
       获取不重复祝福
    ----------------------------------------------- */

    el.innerText =
        getNextMessage();


    /* -----------------------------------------------
       随机背景颜色
    ----------------------------------------------- */

    el.style.background =
        colors[
            Math.floor(
                Math.random()
                * colors.length
            )
        ];


    /* -----------------------------------------------
       平铺位置
    ----------------------------------------------- */

    const cardWidth =
        Math.min(
            180,
            scene.clientWidth * .42
        );


    const cardHeight = 30;


    const flatX =
        random(
            5,
            Math.max(
                5,
                scene.clientWidth
                - cardWidth
            )
        );


    const flatY =
        random(
            45,
            Math.max(
                45,
                scene.clientHeight
                - cardHeight
            )
        );


    /* -----------------------------------------------
       初始出场位置
    ----------------------------------------------- */

    const startX =
        flatX +
        random(-160,160);


    const startY =
        flatY +
        random(-180,180);


    /* -----------------------------------------------
       爱心坐标
    ----------------------------------------------- */

    const t =
        Math.PI * 2
        * index
        / total;


    const heart =
        heartPosition(t);


    /* -----------------------------------------------
       根据屏幕自动缩放
    ----------------------------------------------- */

    const scale =
        Math.min(
            window.innerWidth,
            scene.clientHeight
        ) / 36;


    const heartX =
        heart.x * scale;


    const heartY =
        -heart.y * scale;


    /* -----------------------------------------------
       最终位置
    ----------------------------------------------- */

    const finalX =
        scene.clientWidth / 2
        + heartX
        - cardWidth / 2;


    const finalY =
        scene.clientHeight / 2
        + heartY
        - cardHeight / 2;


    /* -----------------------------------------------
       CSS变量
    ----------------------------------------------- */

    el.style.setProperty(
        "--startX",
        startX + "px"
    );


    el.style.setProperty(
        "--startY",
        startY + "px"
    );


    el.style.setProperty(
        "--flatX",
        flatX + "px"
    );


    el.style.setProperty(
        "--flatY",
        flatY + "px"
    );


    el.style.setProperty(
        "--heartX",
        finalX + "px"
    );


    el.style.setProperty(
        "--heartY",
        finalY + "px"
    );


    el.style.setProperty(
        "--startRotate",
        random(-50,50) + "deg"
    );


    el.style.setProperty(
        "--flatRotate",
        random(-8,8) + "deg"
    );


    el.style.setProperty(
        "--heartRotate",
        random(-5,5) + "deg"
    );


    el.style.setProperty(
        "--enterDuration",
        random(1.2,2.1) + "s"
    );


    /* -----------------------------------------------
       加入页面
    ----------------------------------------------- */

    scene.appendChild(el);


    /* -----------------------------------------------
       依次出现
    ----------------------------------------------- */

    const appearDelay =
        index * 55;


    setTimeout(() => {

        el.classList.add(
            "visible"
        );

    }, appearDelay);


    /* -----------------------------------------------
       5秒后开始汇聚
    ----------------------------------------------- */

    setTimeout(() => {

        el.classList.remove(
            "visible"
        );


        el.classList.add(
            "toHeart"
        );

    }, 5000);


    /* -----------------------------------------------
       爱心形成后轻微漂浮
    ----------------------------------------------- */

    setTimeout(() => {

        el.classList.add(
            "heartFloat"
        );

    }, 8200);

}


/* =========================================================
   创建漂浮小爱心
========================================================= */

function createHeartParticle() {


    const p =
        document.createElement("div");


    p.className =
        "particle";


    p.innerText =
        Math.random() > .3
            ? "♥"
            : "♡";


    p.style.left =
        random(20,80) + "%";


    p.style.top =
        random(25,75) + "%";


    p.style.setProperty(
        "--size",
        random(10,21) + "px"
    );


    p.style.setProperty(
        "--moveX",
        random(-120,120) + "px"
    );


    p.style.setProperty(
        "--moveY",
        random(-140,30) + "px"
    );


    scene.appendChild(p);


    setTimeout(() => {

        p.remove();

    }, 3000);

}


/* =========================================================
   创建闪光
========================================================= */

function createSparkle() {


    const s =
        document.createElement("div");


    s.className =
        "sparkle";


    s.style.left =
        random(15,85) + "%";


    s.style.top =
        random(15,85) + "%";


    scene.appendChild(s);


    setTimeout(() => {

        s.remove();

    }, 1600);

}


/* =========================================================
   播放动画
========================================================= */

function playHeart() {


    /* -----------------------------------------------
       清理上一轮
    ----------------------------------------------- */

    scene
        .querySelectorAll(
            ".message, .particle, .sparkle"
        )
        .forEach(
            el => el.remove()
        );


    /* -----------------------------------------------
       重新打乱祝福语
    ----------------------------------------------- */

    shuffleMessages();


    /* -----------------------------------------------
       祝福数量

       100条全部不同
    ----------------------------------------------- */

    const total = 100;


    /* -----------------------------------------------
       创建100条祝福
    ----------------------------------------------- */

    for (
        let i = 0;
        i < total;
        i++
    ) {

        createMessage(
            i,
            total
        );

    }


    /* -----------------------------------------------
       5秒后开始出现小爱心
    ----------------------------------------------- */

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        setTimeout(
            createHeartParticle,
            5000 + i * 75
        );

    }


    /* -----------------------------------------------
       汇聚过程中闪光
    ----------------------------------------------- */

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        setTimeout(
            createSparkle,
            5600 + i * 100
        );

    }

}


/* =========================================================
   页面打开自动播放
========================================================= */

setTimeout(() => {

    playHeart();

}, 600);


/* =========================================================
   点击底部按钮重新播放
========================================================= */

play.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        playHeart();

    }
);


/* =========================================================
   点击屏幕重新播放
========================================================= */

scene.addEventListener(
    "click",
    function() {

        playHeart();

    }
);


/* =========================================================
   手机横竖屏
========================================================= */

window.addEventListener(
    "resize",
    function() {

        playHeart();

    }
);

</script>
